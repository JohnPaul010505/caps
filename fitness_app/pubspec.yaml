name: fitness_app
description: "FitTrack — Intelligent Fitness Progress Monitoring Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Supabase — auth, database, realtime chat
  supabase_flutter: ^2.3.4

  # State management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.2.0

  # Charts (weight trend, progress)
  fl_chart: ^0.66.2

  # Date formatting
  intl: ^0.19.0

  # Relative timestamps in chat ("2 min ago")
  timeago: ^3.6.1

  # Camera / Gallery image picking (for meal photos & chat images)
  # iOS:  add NSCameraUsageDescription + NSPhotoLibraryUsageDescription to Info.plist
  # Android: no extra config needed for SDK < 33; for SDK 33+ READ_MEDIA_IMAGES is auto-added
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/J.png
    - assets/images/T.png
    - assets/images/triplej_logo.png
    - assets/images/triplej_text1.png
    - assets/images/triplej_text2.png
    - assets/images/triplejBG.png